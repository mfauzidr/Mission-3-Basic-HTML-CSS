<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <title>Register - Chill</title>
</head>
<body style="background-image: url('../images/bg/register-bg.webp');">
    <form>
        <a class="brand-logo" href="../index.html">
            <img src="../images/logo/logo.svg" alt="Chill Logo" class="logo">
        </a>
        <div class="section-header">
            <h2>Daftar</h2>
            <p>Selamat datang!</p>
        </div>
        <div class="input-group">
            <div class="input-section">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Masukkan username">
            </div>
            <div class="input-section">
                <label for="password">Kata Sandi</label>
                <input type="password" name="password" id="password" placeholder="Masukkan kata sandi">
            </div>
            <div class="input-section">
                <label for="password">Konfirmasi Kata Sandi</label>
                <input type="password" name="conrifm-password" id="password" placeholder="Konfirmasi kata sandi">
            </div>
            <div id="auth-option">
                <p>Sudah punya akun? <a id="register" href="login.html">Masuk</a></p>
            </div>
        </div>
        <div class="auth-button">
            <button type="submit">Daftar</button>
            <p>Atau</p>
            <button type="button" id="google-auth"> <img id="g-icon" src="../images/icons/google.svg"/>Daftar dengan Google</button>
        </div>
    </form>
</body>
</html>
