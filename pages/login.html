<!doctype html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <title>Login - Chill</title>
</head>

<body class="flex min-h-screen items-center bg-[url(../assets/bg/login-bg.webp)] bg-cover bg-center bg-no-repeat">
    <main class="flex justify-center w-full">
        <form
            class="box-border w-full min-w-3xs max-w-180 bg-[rgba(24,26,28,0.84)] rounded-lg p-6 m-6 flex flex-col gap-5 h-fit items-center md:p-8">
            <a class="flex items-center justify-center" href="../index.html">
                <img src="../assets/logo/logo-full.svg" class="h-6 md:h-12" alt="Chill Logo" />
            </a>
            <div class="text-center">
                <h1
                    class="font-bold text-lg leading-[140%] tracking-[0.2px] text-white my-[0.67em] md:text-2xl lg:text-[28px]">
                    Masuk
                </h1>
                <p
                    class="font-normal text-xs leading-[140%] tracking-[0.2px] text-white -mt-4 mb-4 md:text-sm lg:text-base">
                    Selamat datang kembali!
                </p>
            </div>
            <div class="flex flex-col gap-6 w-full">
                <fieldset class="border-0 flex flex-col gap-6 m-0 p-0">
                    <div class="flex flex-col gap-1.5 w-full">
                        <label
                            class="font-medium text-xs leading-[140%] tracking-[0.2px] text-white md:text-sm lg:text-base"
                            for="username">Username</label>
                        <input
                            class="bg-none text-xs border-[0.58px] border-solid border-[rgba(231,227,252,0.23)] rounded-[18px] py-2.5 px-3 text-[rgba(193,194,196,1)] focus:outline-none focus:border-[rgba(231,227,252,0.23)] md:text-sm md:py-3 md:px-3.5 lg:text-base lg:py-3.5 lg:px-4"
                            type="text" name="username" id="username" placeholder="Masukkan username" />
                    </div>
                    <div class="flex flex-col gap-1.5 w-full">
                        <label
                            class="font-medium text-xs leading-[140%] tracking-[0.2px] text-white md:text-sm lg:text-base"
                            for="password">Kata Sandi</label>
                        <input
                            class="password-input bg-none text-xs border-[0.58px] border-solid border-[rgba(231,227,252,0.23)] rounded-[18px] py-2.5 px-3 text-[rgba(193,194,196,1)] focus:outline-none focus:border-[rgba(231,227,252,0.23)] md:text-sm md:py-3 md:px-3.5 lg:text-base lg:py-3.5 lg:px-4"
                            type="password" name="password" id="password" placeholder="Masukkan kata sandi" />
                    </div>
                </fieldset>
                <div class="flex justify-between w-full text-white">
                    <p
                        class="font-normal text-xs md:text-sm lg:text-lg leading-[140%] tracking-[0.2px] text-[rgba(193,194,196,1)] flex -mt-3 mb-4 ">
                        Belum punya akun?
                        <a class="text-white no-underline ml-0.5" href="register.html">Daftar</a>
                    </p>
                    <p
                        class="font-normal text-xs md:text-sm lg:text-lg leading-[140%] tracking-[0.2px] text-[rgba(193,194,196,1)] flex -mt-3 mb-4 ">
                        <a class="text-white no-underline ml-0.5" href="#">Lupa kata sandi?</a>
                    </p>
                </div>
            </div>
            <div class="flex flex-col justify-between w-full">
                <button
                    class="flex justify-center items-center gap-1 h-7.5 bg-[rgba(61,65,66,1)] border-[0.58px] border-solid border-[rgba(231,227,252,0.23)] text-white text-xs font-medium py-2.5 px-5 rounded-[13.86px] cursor-pointer md:text-sm lg:text-base md:h-9 lg:h-10"
                    type="submit">
                    Masuk
                </button>
                <p
                    class="font-normal text-[10px] leading-[140%] tracking-[0.2px] text-white flex justify-center my-[1em] md:text-sm lg:text-base">
                    Atau
                </p>
                <button
                    class="flex justify-center items-center gap-1 h-7.5 bg-[rgba(61,65,66,1)] border-[0.58px] border-solid border-[rgba(231,227,252,0.23)] text-white text-xs font-medium py-2.5 px-5 rounded-[13.86px] cursor-pointer md:text-sm lg:text-base md:h-9 lg:h-10"
                    type="button">
                    <img class="w-2.5 h-2.5 md:w-3 md:h-3 lg:w-3.5 lg:h-3.5" src="../assets/icons/google.svg"
                        alt="" />Masuk dengan Google
                </button>
            </div>
        </form>
    </main>
</body>

</html>
